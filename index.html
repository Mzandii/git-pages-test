<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My GitHub Pages Site</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <header>
      <h1>Welcome to My Static Site</h1>
      <nav>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="home">
        <h2>Home Section</h2>
        <p>This is a static website hosted on GitHub Pages.</p>
        <button id="changeTextBtn">Click Me!</button>
        <p id="dynamicText">JavaScript will change this text.</p>
      </section>

      <section id="counter">
        <h2>Counter Example</h2>
        <p>Count: <span id="count">0</span></p>
        <button id="incrementBtn">Increment</button>
        <button id="decrementBtn">Decrement</button>
        <button id="resetBtn">Reset</button>
      </section>

      <section id="user-input">
        <h2>User Input Example</h2>
        <input type="text" id="nameInput" placeholder="Enter your name" />
        <button id="greetBtn">Greet Me</button>
        <p id="greeting"></p>
      </section>

      <section id="data-display">
        <h2>Data Display</h2>
        <div id="dataContainer"></div>
        <button id="loadDataBtn">Load Data</button>
      </section>
    </main>

    <footer>
      <p>
        &copy; <span id="currentYear"></span> My Static Site. All rights
        reserved.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
